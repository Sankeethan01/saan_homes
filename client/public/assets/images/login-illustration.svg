<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background pattern -->
  <g opacity="0.3">
    <circle cx="400" cy="300" r="250" stroke="#6B46C1" stroke-width="2"/>
    <path d="M300 200 L500 400" stroke="#6B46C1" stroke-width="2"/>
    <path d="M500 200 L300 400" stroke="#6B46C1" stroke-width="2"/>
  </g>

  <!-- Communication icons -->
  <g>
    <!-- Message bubble -->
    <rect x="200" y="150" width="60" height="40" rx="20" fill="#6B46C1" opacity="0.2"/>
    <circle cx="240" cy="170" r="4" fill="#6B46C1"/>
    
    <!-- Headphones -->
    <path d="M350 250 C350 200, 450 200, 450 250" stroke="#6B46C1" stroke-width="2" fill="none"/>
    <rect x="340" y="250" width="20" height="30" rx="10" fill="#6B46C1" opacity="0.2"/>
    <rect x="440" y="250" width="20" height="30" rx="10" fill="#6B46C1" opacity="0.2"/>
    
    <!-- Globe -->
    <circle cx="300" cy="350" r="30" stroke="#6B46C1" stroke-width="2" fill="none"/>
    <path d="M280 350 Q300 320, 320 350 Q300 380, 280 350" stroke="#6B46C1" stroke-width="2" fill="none"/>
    
    <!-- Phone -->
    <rect x="380" y="320" width="40" height="60" rx="5" stroke="#6B46C1" stroke-width="2" fill="none"/>
    <circle cx="400" cy="365" r="3" fill="#6B46C1"/>
  </g>

  <!-- Person illustration -->
  <g transform="translate(450,250)">
    <!-- Head -->
    <path d="M0,0 Q30,-10 60,0 Q90,30 60,60 Q30,70 0,60 Q-30,30 0,0" fill="#000"/>
    
    <!-- Hair -->
    <path d="M0,-5 Q30,-15 60,-5 Q90,-15 60,15 Q30,5 0,15 Q-30,-15 0,-5" fill="#000"/>
    
    <!-- Face -->
    <circle cx="20" cy="30" r="3" fill="white"/> <!-- Eye -->
    <path d="M40,35 Q45,40 50,35" stroke="white" stroke-width="2" fill="none"/> <!-- Smile -->
  </g>
</svg> 